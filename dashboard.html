<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Buku Induk Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app">
  <nav class="rail">
    <div class="rail-brand">Induk<span>.</span></div>
    <div class="rail-sub">SD MUHAMMADIYAH · TU DIGITAL</div>
    <div class="rail-nav">
      <a href="dashboard.html" class="active"><span class="rail-num">01</span> Ringkasan Data</a>
      <a href="input.html"><span class="rail-num">02</span> Input &amp; Scan</a>
      <a href="cari.html"><span class="rail-num">03</span> Cari Siswa</a>
    </div>
    <div class="rail-foot">
      Masuk sebagai<br><strong id="namaUser" style="color:#E8D9B8">...</strong>
      <br><br><a href="#" onclick="logout()" style="color:#C7CFE2;">Keluar</a>
    </div>
  </nav>

  <main class="main">
    <div class="topline">
      <div>
        <div class="page-title">Ringkasan Kelengkapan Data</div>
        <div class="page-desc" id="ringkasanTeks">Memuat data...</div>
      </div>
    </div>

    <div class="stat-grid" id="statGrid">
      <!-- diisi otomatis lewat JavaScript -->
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Kelengkapan per Kolom</div>
        <div class="panel-note" id="panelNote"></div>
      </div>
      <div id="kolomList">
        <!-- diisi otomatis lewat JavaScript -->
      </div>
    </div>

    <div class="alert-box" id="alertBox" style="display:none;"></div>
  </main>
</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
  (async function () {
    // 1. Cek dulu apakah user sudah login. Kalau belum, halaman
    //    ini akan otomatis melempar ke login.html dan kode di
    //    bawahnya tidak akan pernah jalan.
    const sesi = await wajibLogin();
    document.getElementById('namaUser').textContent = localStorage.getItem('induk_nama') || sesi.username;

    // 2. Ambil statistik asli dari sheet
    const hasil = await ambilStatistikDashboard();
    if (!hasil.success) {
      document.getElementById('ringkasanTeks').textContent = 'Gagal memuat data: ' + hasil.error;
      return;
    }

    const total = hasil.totalBaris;
    document.getElementById('ringkasanTeks').textContent = total + ' baris terdaftar di sheet DataSiswa';
    document.getElementById('panelNote').textContent = 'dari ' + total + ' baris terdaftar';

    // 3. Render 4 kartu angka teratas (ambil 4 kolom paling penting)
    const kolomUtama = ['NIS', 'NamaLengkap', 'NISN', 'TglLahir'];
    const statGrid = document.getElementById('statGrid');
    kolomUtama.forEach(function (namaKolom) {
      const k = hasil.kolom.find(function (x) { return x.nama === namaKolom; });
      if (!k) return;
      const warnaMerah = k.terisi === 0 ? 'style="color:#A63D40"' : '';
      statGrid.innerHTML += `
        <div class="stat-card">
          <div class="stat-num" ${warnaMerah}>${k.terisi}</div>
          <div class="stat-label">${labelKolom(namaKolom)}</div>
        </div>`;
    });

    // 4. Render progress bar tiap kolom
    const kolomList = document.getElementById('kolomList');
    hasil.kolom.forEach(function (k) {
      const persen = total > 0 ? Math.round((k.terisi / total) * 100) : 0;
      const kelasBar = persen < 10 ? 'bar-fill low' : 'bar-fill';
      kolomList.innerHTML += `
        <div class="field-row">
          <div class="field-name">${labelKolom(k.nama)}</div>
          <div class="bar-track"><div class="${kelasBar}" style="width:${persen}%"></div></div>
          <div class="field-pct">${k.terisi} / ${total}</div>
        </div>`;
    });

    // 5. Tampilkan peringatan kalau NISN masih kosong semua
    const nisnData = hasil.kolom.find(function (x) { return x.nama === 'NISN'; });
    if (nisnData && nisnData.terisi === 0) {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'flex';
      alertBox.innerHTML = '⚠️ <div><strong>NISN belum ada satu pun yang terisi.</strong> Field ini dibutuhkan untuk sinkronisasi Dapodik — prioritaskan sebelum kolom lain.</div>';
    }
  })();

  function labelKolom(nama) {
    const label = {
      NIS: 'NIS', NISN: 'NISN', NamaLengkap: 'Nama Lengkap',
      HurufKlapper: 'Huruf Klapper', JenisKelamin: 'Jenis Kelamin',
      TempatLahir: 'Tempat Lahir', TglLahir: 'Tanggal Lahir',
      Status: 'Status', NamaOrtu: 'Nama Ortu/Wali',
      TglMasukKelas: 'Tgl Masuk Kelas', Catatan: 'Catatan'
    };
    return label[nama] || nama;
  }
</script>

</body>
</html>
