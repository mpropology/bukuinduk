<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Buku Induk Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1E2A45;
  }
  .card {
    background: #FFFDF8; border-radius: 12px; width: 360px;
    padding: 40px 36px 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  .brand { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin-bottom: 4px; color: #1E2A45; }
  .brand span { color: #B8862E; }
  .sub { font-size: 12.5px; color: #5B6472; margin-bottom: 24px; }
  label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #5B6472; margin-bottom: 6px; display: block; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid #DDD5C2; border-radius: 7px;
    font-size: 13.5px; margin-bottom: 16px; font-family: 'Inter', sans-serif;
  }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 7px;
    background: #1E2A45; color: #fff; font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #errorMsg { color: #A63D40; font-size: 12.5px; margin-bottom: 14px; display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">Buku Induk <span>Digital</span></div>
  <div class="sub">Masuk untuk mengelola data siswa</div>

  <div id="errorMsg"></div>

  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" type="text" required autocomplete="username">

    <label for="password">Kata Sandi</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button type="submit" id="submitBtn">Masuk</button>
  </form>
</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    var btn = document.getElementById('submitBtn');
    var errorBox = document.getElementById('errorMsg');
    errorBox.style.display = 'none';

    btn.disabled = true;
    btn.textContent = 'Memeriksa...';

    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;

    var result = await login(username, password);

    if (result.success) {
      window.location.href = 'dashboard.html';
    } else {
      errorBox.textContent = result.error;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  });
</script>

</body>
</html>
